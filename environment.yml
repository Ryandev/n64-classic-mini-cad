name: cadquery
channels:
  - conda-forge
dependencies:
  - python=3.11
  - cadquery=2.8.0
  # FEM (`./run fem`, lib/testing/fem_check.py): mesher and solver, run as external programs.
  # Both GPL; dev-machine tools only, nothing built from them ships.
  - gmsh=4.15.2
  - calculix=2.23
  - pip
  - pip:
      # Not conda packages: these exist only on PyPI.
      - ruff==0.16.5
      - ocp_vscode==4.0.1
      - cq_warehouse @ git+https://github.com/gumyr/cq_warehouse.git@daa46507ecc429c0e2dce11d9d5ffd09b12a42af#egg=cq_warehouse
